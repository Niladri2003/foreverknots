<!doctype html>
<html lang="en" style="background:#0E0C09">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Foreverknots · Wedding Photography</title>
    <meta name="description" content="Forever Knots (foreverknots) — cinematic wedding photography out of Kolkata. Documentary, slow, and printed on paper. Pre-weddings, Bengali weddings and beyond. Tying knots since 2020." />
    <meta name="theme-color" content="#0E0C09" />
    <link rel="canonical" href="https://foreverknots.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foreverknots.studio/" />
    <meta property="og:site_name" content="foreverknots" />
    <meta property="og:title" content="foreverknots · Wedding Photography, Kolkata" />
    <meta property="og:description" content="Cinematic wedding photography out of Kolkata. Documentary, slow, and printed on paper. Tying knots since 2020." />
    <meta property="og:image" content="https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto,c_fill,g_auto,ar_1.91:1,w_1200/foreverknots/hero-veil.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Responsive hero preload: imagesrcset/imagesizes match the <img> below exactly,
         so the browser fetches ONE width and reuses it for the boot image and the React hero. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_2048/foreverknots/hero-veil.jpg"
      imagesizes="100vw"
      imagesrcset="
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_768/foreverknots/hero-veil.jpg 768w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1080/foreverknots/hero-veil.jpg 1080w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1440/foreverknots/hero-veil.jpg 1440w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1920/foreverknots/hero-veil.jpg 1920w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_2048/foreverknots/hero-veil.jpg 2048w"
    />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dvbnkndyc/image/upload/c_fill,w_32,h_32/foreverknots/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://res.cloudinary.com/dvbnkndyc/image/upload/c_fill,w_192,h_192/foreverknots/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/dvbnkndyc/image/upload/c_fill,w_180,h_180/foreverknots/logo.png" />

    <style>
      /* Critical: paint the first hero frame before the JS bundle boots, so LCP no
         longer waits for React to mount. The boot image lives OUTSIDE #root and is
         removed by the hero once React has painted its own copy (removing an element
         does not retract an already-recorded LCP), so it wins LCP no matter whether
         the image or the bundle finishes first.
         Framing mirrors .hero__slides (top:-10%; height:110%) so there is no shift on
         handoff. The 4px height trim is deliberate: current Chromium excludes any image
         whose rect fully covers the viewport (treats it as a background), so a hair
         short of full-bleed keeps this the LCP element. The 4px sits under the hero's
         darkest scrim and is covered the instant the React hero paints, so it is invisible. */
      .boot-hero {
        position: fixed;
        left: 0;
        right: 0;
        top: -10vh;
        height: calc(110vh - 4px);
        object-fit: cover;
        z-index: 0;
        background: #080706;
        pointer-events: none;
      }
      /* First-visit cover: sits over the boot image (same z-level, later in DOM) so
         the intro reads text-then-image instead of the hero flashing before the
         preloader mounts. A plain background div is not an LCP candidate, and LCP
         ignores occlusion, so the boot image underneath still records LCP. The
         inline script removes it up front on repeat visits / reduced motion (no
         preloader those runs); otherwise the React preloader — same opaque dark —
         mounts above it and removes it. */
      .boot-cover {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #0E0C09;
        pointer-events: none;
      }
      /* App paints above the boot image, hiding it the moment the hero renders. */
      #root { position: relative; z-index: 1; }
    </style>
    <noscript><style>.boot-cover { display: none; }</style></noscript>
  </head>
  <body>
    <!-- LCP element. Static, un-animated <img> that lives OUTSIDE #root so React never
         clears it before it paints. The hero removes it (#boot-hero) once its own copy
         has loaded; removing it does not retract the recorded LCP. -->
    <img
      id="boot-hero"
      class="boot-hero"
      alt="Bride beneath a red veil, glowing in candlelight"
      fetchpriority="high"
      decoding="sync"
      sizes="100vw"
      src="https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_2048/foreverknots/hero-veil.jpg"
      srcset="
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_768/foreverknots/hero-veil.jpg 768w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1080/foreverknots/hero-veil.jpg 1080w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1440/foreverknots/hero-veil.jpg 1440w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_1920/foreverknots/hero-veil.jpg 1920w,
        https://res.cloudinary.com/dvbnkndyc/image/upload/f_auto,q_auto:best,w_2048/foreverknots/hero-veil.jpg 2048w"
    />
    <div id="boot-cover" class="boot-cover" aria-hidden="true"></div>
    <script>
      /* First visit: keep the cover so the boot image loads unseen and the preloader
         word is the first thing shown; the React preloader removes it (#boot-cover).
         Repeat visit: drop the cover immediately (no preloader that run) and promote
         the boot hero to an overlay (above the app) so it hides the brief window
         before the React hero paints its own copy and removes it (#boot-hero).
         Reduced motion skips the preloader too, so it also drops the cover.
         On sessionStorage failure assume "seen" — mirrors the app, which skips the
         preloader then, so nothing would ever remove the cover. A timeout is the
         last-resort safety net. Removing either never retracts a recorded LCP. */
      (function () {
        var img = document.getElementById('boot-hero');
        var cover = document.getElementById('boot-cover');
        var seen = true;
        try { seen = !!sessionStorage.getItem('fk-seen'); } catch (e) {}
        var reduced = false;
        try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (cover && (seen || reduced)) { cover.remove(); cover = null; }
        if (img && seen) img.style.zIndex = '140';
        setTimeout(function () {
          if (img) { img.remove(); img = null; }
          if (cover) { cover.remove(); cover = null; }
        }, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
